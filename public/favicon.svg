  <!-- Left flame/streak -->
  <path d="M 20 42 Q 18 32 22 24 Q 24 18 32 16 Q 30 24 28 32 Q 26 38 24 42 Z" fill="url(#flameGrad1)"/>
  
  <!-- Right flame/streak -->
