  <!-- Arrow tip -->
  <path d="M 32 16 L 28 22 M 32 16 L 36 22" stroke="#9370a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Center dot -->
